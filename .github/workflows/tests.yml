name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, reopened]

jobs:
  tests:
    strategy:
      matrix:
        go-version: [1.26.x]
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install Dependencies
        run: go mod download

      - name: Test
        # tell testcontainer to reuse containers and not to use Ryuk
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
          TESTCONTAINERS_REUSE_ENABLE: true

        # due to database tests we need to run tests sequentially, so we set -p 1 to disable parallel test execution
        # may be changed if we decide to split tests into multiple packages and run them in parallel
        run: go test ./... -p 1 -race -coverprofile=coverage.txt -covermode=atomic -gcflags=-l
