name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, reopened]

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "./go.mod"

      - name: Install Dependencies
        run: go mod download

      - name: Test
        # tell testcontainer to reuse containers and not to use Ryuk
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
          TESTCONTAINERS_REUSE_ENABLE: true

        # database tests now clone their own database from a shared template
        # (see testsupport/tcpostgres), so packages can run in parallel; -p 4 bounds
        # concurrent CREATE DATABASE/test-binary load on the runner
        run: go test ./... -p 4 -race -coverprofile=coverage.txt -covermode=atomic -gcflags=-l
